name: Daily fresh leads

# Runs every source scraper, rebuilds the FULL lead dataset (tax roll +
# tax sales + parcel enrichment) via runs/smith_tx/build/run_all_sources.py,
# and commits the regenerated dashboard data (dashboard/data.js + data.json)
# back to main. The push triggers the existing Pages deploy, so the live
# dashboard (https://xcerebroai.github.io/smith-tx-intel/dashboard/) refreshes
# automatically.

on:
  schedule:
    # 11:00 UTC daily = 06:00 CST / 05:00 CDT. The tax roll is a weekly drop
    # and LGBS is monthly, so most days are no-ops (nothing new to commit).
    - cron: "0 11 * * *"
  workflow_dispatch: {}      # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-leads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- Source pulls (each writes to data/raw/, which is gitignored) ---
      # continue-on-error: a single source being down/blocked must not sink
      # the whole refresh. run_all_sources.py builds from whatever raw files
      # exist and logs any that are missing.

      - name: Pull LGBS tax-sale leads
        run: python scrapers/lgbs_smith_tax_sales.py
        continue-on-error: true

      - name: Pull PBFCM tax-resale leads
        run: python scrapers/pbfcm_smith_tax_resale.py
        continue-on-error: true

      - name: Pull delinquent tax roll (SFTP)
        # Requires the SMITH_TAX_SFTP_PASSWORD repo secret. Host/user default
        # to mft.smi.tax / taxrolls inside the adapter; override via secrets
        # if they ever change. Without the secret this step fails and is
        # skipped — the build still runs on the other sources.
        env:
          SMITH_TAX_SFTP_HOST: ${{ secrets.SMITH_TAX_SFTP_HOST }}
          SMITH_TAX_SFTP_USER: ${{ secrets.SMITH_TAX_SFTP_USER }}
          SMITH_TAX_SFTP_PASSWORD: ${{ secrets.SMITH_TAX_SFTP_PASSWORD }}
        run: python scrapers/smith_delinquent_tax.py
        continue-on-error: true

      # --- Full build: all sources -> staged pipeline -> dashboard payload ---
      # Live-fetches Smith CAD parcels for enrichment and writes
      # dashboard/data.js + dashboard/data.json. Not continue-on-error: a
      # build failure should fail the job loudly rather than ship stale data.
      - name: Build full dataset + dashboard
        run: python runs/smith_tx/build/run_all_sources.py

      # --- Commit refreshed dashboard data back to main ---
      - name: Commit refreshed data
        run: |
          git config user.name  "xcerebro-leads-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only dashboard/data.js is committed — that's the file the live
          # dashboard loads (index.html: <script src="data.js">). data.json is
          # a gitignored local copy; raw pulls and the SFTP tax-roll cache live
          # under the gitignored data/raw/; build intermediates stay in runs/.
          git add dashboard/data.js
          if git diff --cached --quiet; then
            echo "No data changes today — nothing to commit."
          else
            git commit -m "chore(data): daily lead refresh $(date -u +%Y-%m-%d)"
            git push
          fi
