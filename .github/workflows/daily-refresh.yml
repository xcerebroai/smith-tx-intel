name: Smith TX — daily refresh + Pages deploy

# Re-runs every Smith County adapter, rebuilds the v5.4.0 lead board, and
# publishes dashboard/ to GitHub Pages. The delinquent-tax SFTP drop refreshes
# weekly; the publicsearch / LGBS / PBFCM / Excess Proceeds adapters refresh
# daily. The workflow pulls the latest available drop on every run.
#
# Credentials: NEVER committed. Fed via repo secrets:
#   secrets.SMITH_TAX_SFTP_HOST      (default mft.smi.tax)
#   secrets.SMITH_TAX_SFTP_USER      (default taxrolls)
#   secrets.SMITH_TAX_SFTP_PASSWORD  (required)
#
# Known CI consideration: scrapers/publicsearch_clerk.py drives Chromium via
# Playwright. Headless Chromium runs cleanly on ubuntu-latest without xvfb;
# the adapter halts gracefully on reCAPTCHA (no challenge has fired on Smith
# read-only quick-search navigations). If a future reCAPTCHA gate appears,
# the publicsearch step will fail and the dashboard will still publish from
# the LGBS + PBFCM + Excess Proceeds + delinquent-tax + parcel_master pulls
# — adapter failures are isolated (continue-on-error per source step).

on:
  schedule:
    # 07:30 UTC ≈ 02:30 CT — runs after typical overnight assessor batches
    - cron: "30 7 * * *"
  workflow_dispatch: {}        # manual trigger from the Actions tab

permissions:
  contents: write              # commit refreshed dashboard/* + data/raw/*.jsonl
  pages: write
  id-token: write

concurrency:
  group: smith-tx-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMITH_TAX_SFTP_HOST:     ${{ secrets.SMITH_TAX_SFTP_HOST || 'mft.smi.tax' }}
      SMITH_TAX_SFTP_USER:     ${{ secrets.SMITH_TAX_SFTP_USER || 'taxrolls' }}
      SMITH_TAX_SFTP_PASSWORD: ${{ secrets.SMITH_TAX_SFTP_PASSWORD }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright playwright-stealth paramiko beautifulsoup4 lxml requests

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Sanity check — credentials present
        run: |
          if [ -z "$SMITH_TAX_SFTP_PASSWORD" ]; then
            echo "::error::SMITH_TAX_SFTP_PASSWORD secret is not set."
            exit 1
          fi
          echo "credentials wired"

      # ----- primary adapters (parallel-safe but kept serial for log readability) -----
      - name: LGBS tax sales
        id: lgbs
        continue-on-error: true
        run: python scrapers/lgbs_smith_tax_sales.py

      - name: PBFCM struck-off resale
        id: pbfcm
        continue-on-error: true
        run: python scrapers/pbfcm_smith_tax_resale.py

      # county_excess_proceeds (sheriff_sale_surplus) DROPPED 2026-05-25 —
      # client doesn't work surplus. Scraper file stays in tree but is not
      # run in CI and is excluded from run_all_sources.py SOURCES list.

      - name: publicsearch.us clerk — FC + keyword sweep
        id: clerk
        continue-on-error: true
        run: python scrapers/publicsearch_clerk.py

      # CAD parcel enrichment runs INLINE inside run_all_sources.py — it
      # queries Smith CAD ArcGIS at build time for the specific parcels
      # primary leads carry AND for the FC-foreclosure address join. The
      # standalone scrapers/parcel_master.py adapter writes a separate
      # enrichment file that the current build path does NOT consume; the
      # step is intentionally omitted here so a parcel_master failure
      # never confuses the audit. The verify_published.py step below
      # checks the inline CAD enrichment produced owners + addresses.

      # ----- enrichment: delinquent-tax SFTP drop (weekly refresh). NOT
      #       continue-on-error — a missed SFTP pull would silently wipe
      #       the 39K delinquent-account universe (the bulk of the board).
      - name: Smith delinquent tax SFTP
        id: dlq
        run: python scrapers/smith_delinquent_tax.py

      # ----- pipeline + dashboard. run_all_sources.py performs the CAD
      #       parcel + address-join enrichment INLINE (queries Smith CAD
      #       ArcGIS at build time). That's the Greene failure mode: if
      #       this step or the inline CAD calls fail silently, owners
      #       come out Unknown. The verify_published step below catches it.
      - name: §17 -> §20 + dashboard render
        id: build
        run: python runs/smith_tx/build/run_all_sources.py

      # ----- SANITY THRESHOLD — fails the build if per-source counts drop
      #       below floor OR if owner/address enrichment ratio collapses
      #       (the Greene "525 of 1,210 leads" / "Unknown owners" guard).
      - name: Verify published — per-source floors + enrichment ratio
        id: verify
        run: python runs/smith_tx/build/verify_published.py dashboard/data.json

      - name: Report failed sources (informational)
        if: always()
        env:
          LGBS_OUT:    ${{ steps.lgbs.outcome }}
          PBFCM_OUT:   ${{ steps.pbfcm.outcome }}
          CLERK_OUT:   ${{ steps.clerk.outcome }}
          DLQ_OUT:     ${{ steps.dlq.outcome }}
        run: |
          fail=""
          for kv in "lgbs:$LGBS_OUT" "pbfcm:$PBFCM_OUT" \
                    "clerk:$CLERK_OUT" "dlq:$DLQ_OUT"; do
            name="${kv%%:*}"; out="${kv##*:}"
            if [ "$out" != "success" ]; then fail="$fail $name($out)"; fi
          done
          if [ -n "$fail" ]; then
            echo "::warning::Some adapters did not succeed:$fail"
          else
            echo "all adapters succeeded"
          fi

      # ----- commit refreshed data.js + audit artifacts to main.
      # Pages is configured legacy-mode (deploys from main branch tree),
      # so the live site updates by committing dashboard/data.js. The
      # 37MB daily commit is intentional; alternative is to switch Pages
      # to "Source: GitHub Actions" + use upload-pages-artifact (kept
      # below as a no-op when Pages is legacy; activates if Pages source
      # is switched later). data.json is local-dev-only — gitignored.
      - name: Commit refreshed data.js + audit artifacts
        run: |
          git config user.name  "Smith TX Daily Refresh Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.js || true
          git add runs/smith_tx/build/staged_v5_4_0_all_sources/*.json || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Smith TX daily refresh — $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

      # ----- publish dashboard/ to Pages -----
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
