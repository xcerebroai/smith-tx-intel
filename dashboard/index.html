<!DOCTYPE html>
<html lang="en" data-ready="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smith County Distress Intelligence</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top bar: identity + live build stats (UI-5) -->
  <header class="topbar">
    <div class="brand">
      <h1>Smith County Distress Intelligence</h1>
      <span class="brand-sub">Operator lead board &middot; private artifact</span>
    </div>
    <div class="topstats" id="topStats"></div>
    <div class="topactions">
      <button id="exportFiltered" class="btn">Export filtered CSV</button>
      <button id="exportMarked" class="btn btn-mark">Export marked &mdash; <span id="markedCount">0</span></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="filterbar" id="filterSummary"></div>

  <main>
    <!-- Filter sidebar (UI-2) -->
    <aside class="sidebar" id="sidebar">
      <section class="side-block">
        <h2>Quick views</h2>
        <div class="presets" id="presets"></div>
      </section>

      <section class="side-block">
        <h2>Search</h2>
        <input type="text" id="search" placeholder="owner, address, instrument&hellip;">
      </section>

      <section class="side-block">
        <h2>Foreclosure sale window</h2>
        <select id="saleWindow">
          <option value="any">Any sale date</option>
          <option value="21">Next 21 days</option>
          <option value="60">Next 60 days</option>
          <option value="90">Next 90 days</option>
        </select>
      </section>

      <section class="side-block">
        <h2>Assessed value</h2>
        <div class="range-row">
          <input type="number" id="valMin" placeholder="min $" min="0" step="10000">
          <span>&ndash;</span>
          <input type="number" id="valMax" placeholder="max $" min="0" step="10000">
        </div>
      </section>

      <section class="side-block">
        <h2>Distress signal</h2>
        <div class="checkgroup" id="signalFilter"></div>
      </section>

      <section class="side-block">
        <h2>Owner type</h2>
        <div class="checkgroup" id="ownerFilter"></div>
      </section>

      <section class="side-block">
        <h2>Enrichment</h2>
        <label class="chk"><input type="checkbox" id="togAbsentee"> Absentee owner only</label>
        <label class="chk"><input type="checkbox" id="togOos"> Out-of-state owner only</label>
        <label class="chk"><input type="checkbox" id="togReview"> Review-required only</label>
      </section>

      <button id="resetBtn" class="btn btn-block">Reset all filters</button>
    </aside>

    <!-- Results (UI-3 rows, UI-7 windowed render) -->
    <section class="results">
      <div class="results-head">
        <span class="rowcount" id="rowCount">&mdash;</span>
        <label class="sort-ctl">Sort
          <select id="sortMode">
            <option value="urgency">Urgency (default)</option>
            <option value="sale">Sale date &uarr;</option>
            <option value="value">Assessed value &darr;</option>
            <option value="recent">Recently filed</option>
            <option value="signals">Signal count &darr;</option>
          </select>
        </label>
        <span class="legend">
          <span class="lg lg-r"></span>Foreclosure &le;21d
          <span class="lg lg-o"></span>22&ndash;60d
          <span class="lg lg-g"></span>Estate-titled
          <span class="lg lg-y"></span>Multi-signal
          <span class="lg lg-v"></span>Review required
        </span>
      </div>
      <div class="leadlist" id="leadList"></div>
      <div class="empty" id="emptyMsg" hidden></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
